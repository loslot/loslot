<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" width="800" height="534">
  <defs>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- 1: Computer Science (16 chars x 13.2 = 211.2) -->
    <clipPath id="type1">
      <rect x="84" y="182" height="36" width="0">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.1167;0.2333;0.3167;1"
          values="0;211.2;211.2;0;0"/>
      </rect>
    </clipPath>

    <!-- 2: Full-Stack Developer (20 chars x 13.2 = 264) -->
    <clipPath id="type2">
      <rect x="84" y="182" height="36" width="0">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.3333;0.45;0.5667;0.65;1"
          values="0;0;264;264;0;0"/>
      </rect>
    </clipPath>

    <!-- 3: AI Engineer (11 chars x 13.2 = 145.2) -->
    <clipPath id="type3">
      <rect x="84" y="182" height="36" width="0">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.6667;0.7833;0.9;0.9833;1"
          values="0;0;145.2;145.2;0;0"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .chips text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .ai rect   { fill: #0B2A38; stroke: #155E75; }
    .ai text   { fill: #22D3EE; }
    .web rect  { fill: #1F1A44; stroke: #4C3A8F; }
    .web text  { fill: #C4B5FD; }
    .tool rect { fill: #1A2233; stroke: #2A3347; }
    .tool text { fill: #CBD5E1; }
    .cs rect   { fill: #0A2630; stroke: #0E5C70; }
    .cs text   { fill: #22D3EE; }
  </style>

  <rect x="10" y="10" width="780" height="514" rx="12" fill="#070B14" stroke="#1E293B"/>

  <!-- Animated border beams (outside the card). Perimeter = 2586 -->
  <!-- Cyan glow -->
  <rect x="6" y="6" width="788" height="522" rx="16" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-opacity="0.22" stroke-dasharray="380 2210">
    <animate attributeName="stroke-dashoffset" from="0" to="-2590" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Cyan line -->
  <rect x="6" y="6" width="788" height="522" rx="16" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="380 2210">
    <animate attributeName="stroke-dashoffset" from="0" to="-2590" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Purple glow -->
  <rect x="6" y="6" width="788" height="522" rx="16" fill="none" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" stroke-opacity="0.22" stroke-dasharray="380 2210">
    <animate attributeName="stroke-dashoffset" from="-1295" to="-3885" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Purple line -->
  <rect x="6" y="6" width="788" height="522" rx="16" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-dasharray="380 2210">
    <animate attributeName="stroke-dashoffset" from="-1295" to="-3885" dur="8s" repeatCount="indefinite"/>
  </rect>

  <path d="M10 22a12 12 0 0 1 12-12h756a12 12 0 0 1 12 12v26H10z" fill="#0D1424"/>
  <line x1="10" y1="48" x2="790" y2="48" stroke="#1E293B"/>
  <rect x="150" y="10" width="500" height="1.5" fill="url(#glow)"/>
  <circle cx="32" cy="29" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="29" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="29" r="6" fill="#27C93F"/>
  <text x="400" y="33" class="mono" font-size="12" fill="#94A3B8" text-anchor="middle">lotlos@terminal:~</text>

  <text x="40" y="92" class="mono" font-size="17" fill="#94A3B8">print(<tspan fill="#22D3EE">"Hello, world"</tspan>)</text>
  <text x="40" y="150" class="sans" font-size="52" font-weight="800" fill="#E6EDF7">I’m <tspan fill="#22D3EE">Lot Los</tspan></text>

  <!-- Typing line: three phrases in turn -->
  <text x="40" y="208" class="mono" font-size="22" font-weight="700" fill="#A78BFA">$&gt;</text>
  <text x="84" y="208" class="mono" font-size="22" font-weight="700" fill="#22D3EE" textLength="211.2" lengthAdjust="spacing" clip-path="url(#type1)">Computer Science</text>
  <text x="84" y="208" class="mono" font-size="22" font-weight="700" fill="#22D3EE" textLength="264" lengthAdjust="spacing" clip-path="url(#type2)">Full-Stack Developer</text>
  <text x="84" y="208" class="mono" font-size="22" font-weight="700" fill="#22D3EE" textLength="145.2" lengthAdjust="spacing" clip-path="url(#type3)">AI Engineer</text>

  <rect x="84" y="190" width="10" height="24" fill="#22D3EE">
    <animate attributeName="x" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.1167;0.2333;0.3167;0.3333;0.45;0.5667;0.65;0.6667;0.7833;0.9;0.9833;1"
      values="84;295.2;295.2;84;84;348;348;84;84;229.2;229.2;84;84"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <line x1="40" y1="234" x2="760" y2="234" stroke="#1E293B"/>

  <g fill="#94A3B8">
    <path d="M46 252a5.5 5.5 0 0 0-5.5 5.5c0 4.2 5.5 9.5 5.5 9.5s5.5-5.3 5.5-9.5A5.5 5.5 0 0 0 46 252z"/>
    <circle cx="46" cy="257.5" r="2" fill="#070B14"/>
    <path d="M46 280l-9 4.5 9 4.5 9-4.5z"/>
    <path d="M40.5 288v4c3 3.5 8 3.5 11 0v-4l-5.5 2.7z"/>
    <text x="38" y="320" class="mono" font-size="13" font-weight="700">&gt;_</text>
  </g>
  <text x="66" y="264" class="sans" font-size="15" fill="#94A3B8">Location: <tspan fill="#E6EDF7">Phnom Penh, Cambodia</tspan></text>
  <text x="66" y="292" class="sans" font-size="15" fill="#94A3B8">Education: <tspan fill="#E6EDF7"> Computer Science & AI Engineer</tspan></text>
  <text x="66" y="320" class="sans" font-size="15" fill="#94A3B8">Interested in: <tspan fill="#E6EDF7">AI Engineering</tspan></text>

  <text x="40" y="362" class="sans" font-size="15" font-weight="700" fill="#E6EDF7">Skills &amp; Technologies</text>

  <g class="chips">
    <g class="ai">
      <rect x="40" y="376" width="71" height="26" rx="13"/><text x="75.5" y="393">Python</text>
      <rect x="119" y="376" width="143" height="26" rx="13"/><text x="190.5" y="393">Machine Learning</text>
      <rect x="270" y="376" width="122" height="26" rx="13"/><text x="331" y="393">Deep Learning</text>
      <rect x="400" y="376" width="57" height="26" rx="13"/><text x="428.5" y="393">LLMs</text>
      <rect x="465" y="376" width="78" height="26" rx="13"/><text x="504" y="393">PyTorch</text>
      <rect x="551" y="376" width="114" height="26" rx="13"/><text x="608" y="393">scikit-learn</text>
    </g>
    <g class="web">
      <rect x="40" y="410" width="100" height="26" rx="13"/><text x="90" y="427">TypeScript</text>
      <rect x="148" y="410" width="100" height="26" rx="13"/><text x="198" y="427">JavaScript</text>
      <rect x="256" y="410" width="64" height="26" rx="13"/><text x="288" y="427">React</text>
      <rect x="328" y="410" width="78" height="26" rx="13"/><text x="367" y="427">Next.js</text>
      <rect x="500" y="410" width="114" height="26" rx="13"/><text x="557" y="427">Tailwind CSS</text>
      <rect x="622" y="410" width="93" height="26" rx="13"/><text x="668.5" y="427">REST APIs</text>
    </g>
    <g class="tool">
      <rect x="40" y="444" width="100" height="26" rx="13"/><text x="90" y="461">PostgreSQL</text>
      <rect x="148" y="444" width="50" height="26" rx="13"/><text x="173" y="461">SQL</text>
      <rect x="206" y="444" width="71" height="26" rx="13"/><text x="241.5" y="461">Docker</text>
      <rect x="285" y="444" width="50" height="26" rx="13"/><text x="310" y="461">Git</text>
      <rect x="343" y="444" width="129" height="26" rx="13"/><text x="407.5" y="461">GitHub Actions</text>
      <rect x="480" y="444" width="64" height="26" rx="13"/><text x="512" y="461">Linux</text>
    </g>
    <g class="cs">
      <rect x="40" y="478" width="100" height="26" rx="13"/><text x="90" y="495">Algorithms</text>
      <rect x="148" y="478" width="136" height="26" rx="13"/><text x="216" y="495">Data Structures</text>
      <rect x="292" y="478" width="93" height="26" rx="13"/><text x="338.5" y="495">Databases</text>
      <rect x="393" y="478" width="150" height="26" rx="13"/><text x="468" y="495">Operating Systems</text>
    </g>
  </g>
</svg>
